
name: Build Pulse Timer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      
      - name: Validate Android manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              ET.parse("app/src/main/AndroidManifest.xml")
              print("Manifest XML is valid")
          except ET.ParseError as e:
              print(f"MANIFEST XML ERROR: {e}")
              raise
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseTimer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
